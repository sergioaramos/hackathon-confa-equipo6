[project]
name = "pase-confa-backend"
version = "0.1.0"
description = "APIs de Pase CONFA (Lambdas en Python)"
requires-python = ">=3.10"
dependencies = []

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "eval: casos de evaluación del agente; necesitan Bedrock (correr con pytest -m eval)",
]
addopts = "-m 'not eval'"
